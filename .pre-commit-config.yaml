default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      - id: ruff-check
        args: [--fix]

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  - repo: local
    hooks:
      - id: ruff-full-tree
        name: ruff (full tree, matches CI)
        entry: uv run --directory backend ruff check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: black-full-tree
        name: black (full tree, matches CI)
        entry: uv run --directory backend black --check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]