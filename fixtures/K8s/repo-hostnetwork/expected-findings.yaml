findings:
  - rule_id:  K8S002
    severity: HIGH
    file:     deployment.yaml
    line:     15
    message: >
      Pod uses hostNetwork: true, giving it direct access to the host's
      network namespace and any services bound to it. Remove hostNetwork
      (and hostPID/hostIPC) unless the workload has a specific, reviewed
      need for host namespace access.
