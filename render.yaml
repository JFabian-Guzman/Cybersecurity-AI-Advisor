databases:
  - name: cybersec-db
    databaseName: cybersec
    user: cybersec
    plan: free

services:
  - type: web
    name: cybersec-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cybersec-db
          property: connectionString
      - key: RELOAD
        value: "false"
      - key: FRONTEND_ORIGIN
        sync: false

  - type: web
    name: cybersec-frontend
    runtime: static
    rootDir: frontend
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: ./dist
    autoDeploy: false
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html