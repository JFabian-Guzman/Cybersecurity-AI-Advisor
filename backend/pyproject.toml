[project]
name = "backend"
version = "0.1.0"
description = "CyberSecurity Advisor backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "fastapi>=0.137.2",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.3.4",
    "redis>=8.0.0",
    "rq>=2.9.1",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
    "uvicorn>=0.49.0",
    "python-multipart>=0.0.20",
    "docker>=7.1.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "ruff>=0.10.0",
    "black>=25.1.0",
    "mypy>=1.15.0",
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0.3",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.black]
line-length = 120
target-version = ["py314"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
