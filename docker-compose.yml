services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cybersec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cybersec}
      POSTGRES_DB: ${POSTGRES_DB:-cybersec}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cybersec}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@cybersec.io}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-cybersec}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cybersec}:${POSTGRES_PASSWORD:-cybersec}@postgres:5432/${POSTGRES_DB:-cybersec}
      REDIS_URL: redis://redis:6379/0
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-5173}
      RELOAD: "true"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: uv run python -m app.worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cybersec}:${POSTGRES_PASSWORD:-cybersec}@postgres:5432/${POSTGRES_DB:-cybersec}
      REDIS_URL: redis://redis:6379/0
      SANDBOX_IMAGE: cybersecurity-ai-advisor-sandbox
      SANDBOX_TIMEOUT_SECONDS: "120"
      SANDBOX_MAX_CLONE_MB: "500"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  sandbox:
    build:
      context: ./backend
      dockerfile: app/sandbox/Dockerfile
    image: cybersecurity-ai-advisor-sandbox
    profiles: ["sandbox"]
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 128

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  backend_venv:
  frontend_node_modules: